],evidence:[
{id:'E01',stage:1,type:'ملف البداية',title:'بلاغ اختفاء شريف',front:'مكتب مغلق… ورجل مفقود',body:'في صباح اليوم التالي، أُبلغ عن اختفاء شريف المنشاوي من مكتبه في الفيلا. وفي الوقت نفسه، تبيّن أن الحافظة الورقية المعروفة باسم «ملف المرآة» لم تعد في مكانها. لا يوجد حتى الآن ما يثبت أن الاختفاءين حدثا في اللحظة نفسها.',proves:'هناك واقعتان مترابطتان محتملًا: اختفاء شريف وغياب ملف المرآة.',limit:'لا يثبت البلاغ وحده أن الواقعتين نفذهما الشخص نفسه.',clue:'ابدأ بالسؤال: مَن يستفيد من فصل الاختفاءين إلى قصتين منفصلتين؟',category:'القضية'},
{id:'E02',stage:1,type:'خط زمني',title:'توقيت 12:30 ثم 1:31',front:'ساعة لا تتفق مع بقية الساعات',body:'تبدأ نافذة اضطراب عرض الوقت عند 12:30 بعد منتصف الليل. لاحقًا، تظهر على عدد من الأجهزة علامة 1:31. لا يعني ذلك أن الزمن توقف أو قفز فعليًا؛ بل إن عرض الوقت وتسلسل السجلات أصبحا مضللين.',proves:'التوقيت المعروض لا يمكن اعتماده وحده لإعادة بناء الليلة.',limit:'لا يحدد هذا الدليل مَن تسبب في الاضطراب.',clue:'افصل دائمًا بين وقت الحدث، ووقت تسجيله، والوقت الذي عرضته الشاشة.',category:'زمني'},
{id:'E03',stage:1,type:'سجل وصول',title:'وصول الضيوف',front:'السادسة مساءً — نقطة ثابتة',body:'تؤكد ملاحظات الأمسية أن الضيوف وصلوا إلى الفيلا عند الساعة 6:00 مساءً. لا يوجد وصول للضيوف عند 12:20 بعد منتصف الليل. اعتبر السادسة مساءً بداية ثابتة للأمسية، ولا تسمح لخلط التوقيتات اللاحق بتغييرها.',proves:'بداية الأمسية عند 6:00 مساءً.',limit:'لا يثبت سجل الوصول مكان كل شخص بعد منتصف الليل.',clue:'استخدم الوقائع الثابتة لتقييم ذكريات الشهود اللاحقة.',category:'زمني'},
{id:'E04',stage:1,type:'ملف مادي',title:'ملف المرآة',front:'وثيقة واحدة… روايتان',body:'«ملف المرآة» حافظة تضم نسخًا متعارضة من اتفاقية استحواذ قديمة، وملاحظات وموافقات وتوقيتات تكشف أن الرواية الرسمية عن الصفقة لم تكن كاملة. كان شريف ينوي تسليم الأصل إلى محامٍ مستقل صباح اليوم التالي.',proves:'هناك دافع تجاري قوي لمنع وصول الوثيقة الأصلية إلى جهة مستقلة.',limit:'وجود الدافع لا يحدد وحده مرتكب الاختفاء.',clue:'اسأل مَن يستفيد من بقاء النسخة المتداولة وحدها.',category:'وثائق'},
{id:'E05',stage:1,type:'شهادة',title:'الأربعة الذين لاحظوا',front:'أربعة فقط أدركوا أن هناك خللًا',body:'ثلاثة محققين واللاعب الذي يؤدي دور الشخص المتورط يعرفون منذ البداية أن عرض التوقيت جرى التلاعب به. بقية الشخصيات فسرت التناقضات باعتبارها عطلًا عاديًا أو خطأ في الذاكرة.',proves:'المحققون يملكون فرضية مبكرة عن التلاعب، والمجرم يعلم أن الوقت جزء من القضية.',limit:'معرفة وجود تلاعب لا تثبت وحدها من نفذه.',clue:'في المود الجماعي، لا تفترض أن لاعب دور المجرم يعرف تفاصيل الخطة كاملة.',category:'شهادات'},
{id:'E06',stage:1,type:'محضر أمن',title:'ملاحظة ياسين',front:'سجلان… ووقت مختلف',body:'لاحظ ياسين مراد اختلافًا بين توقيت سجل الكاميرات وتوقيت لوحة الأمن. في البداية، اعتقد أن الأمر ناتج عن إعداد قديم، لذلك لم يبلّغ عنه فورًا. يمكن أن تقود ملاحظته إلى مرجع زمني مستقل.',proves:'هناك تناقض قابل للفحص بين مصدرين داخل الفيلا.',limit:'الاختلاف لا يكشف وحده سبب التناقض أو هوية المسؤول.',clue:'اطلب مقارنة مستقلة بدل اختيار الساعة التي تبدو أكثر إقناعًا.',category:'زمني'},

{id:'E08',stage:2,type:'ملاحظة حركة',title:'مروان قرب الممر',front:'مرور عابر أم فرصة؟',body:'عند نحو 12:41، مر مروان قرب الممر المؤدي إلى مكتب شريف بحجة إجراء مكالمة. توقيت الكاميرا متأخر عن المرجع المستقل. المرور يمنحه فرصة محتملة، لكنه لا يكفي وحده لإثبات أنه نقل الحافظة.',proves:'مروان كان قرب مسار الوصول إلى المكتب في نافذة زمنية مهمة.',limit:'الوجود قرب المكان ليس دليل إدانة منفردًا.',clue:'اربط الفرصة بأثر مادي وتناقض زمني ودافع.',category:'حركة'},
{id:'E09',stage:2,type:'سجل إداري',title:'الظرف الذي تركته سلمى',front:'مهمة روتينية في توقيت مضلل',body:'تركت سلمى ظرفًا على مكتب الاستقبال وفق تعليمات سابقة، ولم تكن تعرف محتواه. تذكرت وقتًا غير دقيق لأنها اعتمدت على شاشة متأثرة. الظرف والحركة الإدارية قد يبدوان مريبين، لكن لا دليل هنا على علمها بخطة إخفاء الملف.',proves:'اعتماد شاهد على شاشة متأثرة قد ينقل الحدث إلى وقت غير صحيح.',limit:'لا يربط هذا الدليل سلمى بخطة مروان.',clue:'ميّز بين من نفّذ حركة عادية ومن استغل الحركة.',category:'شهادات'},
{id:'E10',stage:2,type:'أثر مادي',title:'أثر قرب الخزانة القديمة',front:'تفصيل صغير في الممر الخلفي',body:'تظهر ملاحظة فحص المكان وجود أثر مادي صغير قرب خزانة ملفات قديمة في الممر الخلفي المؤدي إلى غرفة الأرشيف. الخزانة تصلح كمخبأ مؤقت، لكن الأثر يحتاج إلى مقارنته بسجل الحركة وبقية القرائن قبل استنتاج مَن استخدمها.',proves:'هناك نقطة تستحق فحصها في مسار انتقال الحافظة.',limit:'الأثر لا يسمّي صاحبه ولا يثبت وحده أن الملف مر من هناك.',clue:'قيمة الأثر تأتي من توافقه مع مصدر مستقل آخر.',category:'مادي'},
{id:'E11',stage:2,type:'لقطة كاميرا',title:'المقطع الناقص',front:'الكاميرا لا تحكي القصة كاملة',body:'توجد لقطة مقتطعة قرب مسار الحركة الخلفي. لا تثبت اللقطة خروج شريف ولا تنفيه، ولا تعرض العملية كاملة. لكنها تترك فجوة تتطلب المقارنة بسجل آخر وقرينة مكانية.',proves:'سجل الكاميرا غير مكتمل ولا يصلح رواية نهائية بمفرده.',limit:'لا يجوز اعتبار غياب الصورة دليلًا على غياب الحدث.',clue:'ما المصدر الآخر الذي يمكن أن يملأ الفجوة دون الاعتماد على التخمين؟',category:'رقمي'},
{id:'E12',stage:2,type:'رسالة',title:'رسالة بوقت 1:31',front:'رسالة صحيحة في محتواها… مضللة في توقيتها',body:'رسالة مرتبطة بأحداث الليلة تحمل علامة 1:31 على جهاز متأثر. لا يثبت الطابع الزمني أن الحدث المرتبط بالرسالة وقع بعد الواحدة؛ يجب فحص مصدر الوقت ومقارنته بمرجع مستقل.',proves:'علامة 1:31 لا تصلح وحدها لترتيب الأحداث.',limit:'لا تعني الرسالة بالضرورة أن محتواها مزور.',clue:'اسأل: هل الوقت المعروض هو وقت الإرسال، أم الاستلام، أم عرض السجل؟',category:'رقمي'},
{id:'E13',stage:3,type:'مرجع مستقل',title:'سجل الاتصال الخارجي',front:'ساعة خارج الفيلا',body:'يوجد سجل استقبال اتصال آلي وارد إلى خط أرضي خارجي تحتفظ به خدمة اتصالات منفصلة عن ساعة الفيلا. يمكن استخدامه كنقطة مقارنة مستقلة إذا تم التحقق من مصدره وربط حدث معروف به وبمصدر آخر.',proves:'يمكن تأسيس مرجع زمني مستقل عن مجموعة الأجهزة المتأثرة داخل الفيلا.',limit:'السجل لا يحل القضية تلقائيًا ولا يحدد الجاني بمفرده.',clue:'لإثبات استقلال المرجع، تحتاج إلى مصدره الخارجي وحدث يمكن مقارنته بمصدر آخر.',category:'زمني'},
{id:'E14',stage:3,type:'مسار الملف',title:'من المكتب إلى الخزانة',front:'المخبأ المؤقت ليس النهاية',body:'تتوافق صورة المكتب ومعلومة المحامي عن النسخة الأصلية مع وجود ملف المرآة في مكتب شريف قبل الاضطراب. تشير القرائن المادية والإدارية إلى انتقال الحافظة إلى خزانة الملفات القديمة في الممر الخلفي، كمخبأ مؤقت لا كمكان نهائي.',proves:'مسار الملف المحتمل يبدأ من المكتب ويمر بالخزانة القديمة.',limit:'العثور على المسار لا يكفي وحده لإدانة شخص بعينه.',clue:'من امتلك الفرصة؟ وما القرينة التي تربطه بالفعل؟',category:'مادي'},
{id:'E15',stage:3,type:'مكان',title:'ملحق الضيافة الخلفي',front:'غرفة الأرشيف القديمة',body:'توجد غرفة أرشيف قليلة الاستخدام في ملحق الضيافة الخلفي ضمن الملكية العائلية. تشير قرائن مكانية ومسار حركة غير مكتمل إلى أنها قد تكون مرتبطة باختفاء شريف وبالمكان النهائي لملف المرآة.',proves:'غرفة الأرشيف وجهة تستحق التحقيق بناءً على مجموعة قرائن.',limit:'لا يجوز كشف مكان شريف أو الملف بدليل مكاني واحد.',clue:'اربط المسار بلقطة الكاميرا والسجل الزمني والقرينة المكانية.',category:'مكان'},
{id:'E16',stage:3,type:'وثيقة تجارية',title:'التناقض في الاتفاقية',front:'مَن يستفيد من اختلاف النسختين؟',body:'النسخة الأصلية من ملف المرآة تربط بين من عرف بالتعديل، وتوقيت اعتماد النسخة المختلف عليها، والطرف الذي استفاد من إبقاء الاختلاف مخفيًا. كانت رواية مروان عن الصفقة ناقصة ومضللة، وكان تسليم الأصل سيجبره على تفسير التناقضات أمام جهة مستقلة.',proves:'يوجد دافع تجاري محدد لمنع تسليم الملف.',limit:'الدافع وحده لا يثبت التنفيذ؛ يجب دعمه بالفرصة والتوقيت والأثر.',clue:'أكمل سلسلة: الدافع + الفرصة + الأثر + التناقض الزمني.',category:'وثائق'},
{id:'E17',stage:3,type:'مذكرة دور',title:'ملاحظة لم يكن مروان يتوقعها',front:'السجلات لم تتفق تمامًا',body:'مذكرة داخلية ضمن مسار الدور تشير إلى أن أحد المساعدين ترك أثرًا غير مقصود، وأن ترتيب الرسائل الذي بدا متماسكًا لم ينجح على كل الأجهزة. لم يكن مروان يعلم أن ياسين لاحظ اختلافًا يمكن مقارنته بمرجع مستقل.',proves:'الخطة اعتمدت على خلق رواية ظاهرية متماسكة، لكنها تركت تناقضًا قابلًا للكشف.',limit:'المذكرة لا تغني عن فحص الأدلة المادية والزمنية.',clue:'في المود الجماعي، تُسلّم هذه المذكرة للاعب دور المجرم فقط بعد فتح المرحلة الثالثة.',category:'سري'},
{id:'E18',stage:3,type:'الخلاصة',title:'السؤال الذي يجمع القضية',front:'لماذا اختفى الرجل والملف معًا؟',body:'الفرضية التي تفسر الوقائع بأقل عدد من الافتراضات هي أن شخصًا أراد منع وصول ملف المرآة إلى محامٍ مستقل، فاستغل اضطراب عرض الوقت ليجعل حركة الملف واختفاء شريف يبدوان كحدثين منفصلين. يجب دعم هذه الفرضية بأكثر من قرينة مستقلة قبل الاتهام.',proves:'يوجه التحقيق إلى تفسير موحد للاختفاءين والتوقيت.',limit:'لا يُكشف الحل النهائي إلا بعد تسجيل الاتهام وتبريره.',clue:'من المستفيد من منع تسليم الملف؟ مَن مر قرب المكتب؟ ما الأثر؟ وما المرجع الذي يكشف توقيت السجلات؟',category:'استنتاج'}
]};
const KEY='casezero_clock001_v2';let state=load();let activeView='evidence',filter='الكل',interviewPerson=1,groupCount=4;
function fresh(){return {mode:null,stage:1,revealed:[],notes:'',suspectNotes:{},timelineDone:false,accused:'',reason:'',confidence:'',groupCount:4,roles:{},usedHints:[],solved:false,started:false}}
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}function save(){localStorage.setItem(KEY,JSON.stringify(state));updateProgress()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.add('hidden'),2600)}
function updateProgress(){let el=document.getElementById('progressFill'),count=document.getElementById('progressCount');if(el)el.style.width=(state.revealed.length/CASE.evidence.length*100)+'%';if(count)count.textContent=state.revealed.length+' / '+CASE.evidence.length}
function render(){let app=document.getElementById('app');if(!state.started){app.innerHTML=home();return}app.innerHTML=`<div class="layout"><aside class="sidebar"><div class="case-summary"><div class="eyebrow">ACTIVE INVESTIGATION</div><h3>${CASE.title}</h3><p>${CASE.place}</p></div><div class="progressbox"><div class="progress-head"><span>الأدلة المفتوحة</span><span id="progressCount">${state.revealed.length} / ${CASE.evidence.length}</span></div><div class="progress"><i id="progressFill" style="width:${state.revealed.length/CASE.evidence.length*100}%"></i></div></div><nav class="nav">${[['evidence','▤','كروت الأدلة'],['interviews','◉','الاستجواب'],['timeline','◷','الخط الزمني'],['board','⌘','لوحة الربط'],['notebook','▧','دفتر الملاحظات'],['final','⚑','الاستنتاج النهائي'],['roles','♙','الأدوار والقواعد']].map(([id,ico,label])=>`<button class="${activeView===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}</nav><div class="side-foot">${state.mode==='solo'?'SOLO INVESTIGATION':'CARD TABLE MODE'}<br>FILE #0001 · التقدم محفوظ على هذا الجهاز</div></aside><section class="mainpanel">${viewContent()}</section></div>`;updateProgress()}
function home(){return `${profileBanner()}<section class="hero ${artwork?'has-cover':''}" style="${artwork?`--case-cover:url('${artwork}')`:''}"><div class="eyebrow">SHADOW FILES / INVESTIGATION FILE 001</div><h2>الساعة التي <span>لم تحدث</span></h2><p>اختفى شريف المنشاوي من مكتبه، واختفى معه «ملف المرآة». سجلات الأجهزة تحكي أوقاتًا متناقضة، والشهود يتذكرون الليلة بطرق مختلفة. اجمع الأدلة، استجوب الشخصيات، أعد بناء التوقيت الحقيقي، ثم قرر مَن المسؤول.</p><div class="hero-grid"><button class="mode-card" onclick="start('solo')"><span class="num">MODE 01 / SOLO</span><h3>المحقق المنفرد</h3><p>افتح الأدلة بالتدريج، راجع الشهادات، واكتب نظريتك الخاصة قبل تقديم الاتهام.</p></button><button class="mode-card" onclick="start('group')"><span class="num">MODE 02 / CARD TABLE</span><h3>تحقيق جماعي — استايل كروت</h3><p>اختاروا عدد اللاعبين، وزّعوا أدوار الطاولة، واقلبوا الأدلة وناقشوها معًا.</p></button></div><div class="stats"><div class="stat"><strong>18</strong><span>بطاقة تحقيق</span></div><div class="stat"><strong>06</strong><span>شخصيات للاستجواب</span></div><div class="stat"><strong>03</strong><span>مراحل كشف</span></div><div class="stat"><strong>01</strong><span>حقيقة واحدة</span></div></div><p style="font-size:11px;margin:18px 0 0;color:#94849f">تجربة محلية بدون صور. لا يُكشف الحل النهائي إلا بعد تسجيل اتهامك.</p></section><section class="customcase-card"><div class="eyebrow">PLAYER PROFILE / CASE LAB</div><h3>ملفك الشخصي ومعمل القضايا</h3><p class="small muted">عدّل اسمك وصورة الأحرف، واحفظ نسخة من اللعبة على جهازك. إنشاء قضية جديدة يُفتح بعد حل القضية الأولى.</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="editProfile()">تعديل البروفايل والصور</button><button class="btn" onclick="downloadGameInfo()">تحميل ويندوز / أندرويد</button>${state.solved?'<button class="btn primary" onclick="createCase()">＋ اصنع قضية جديدة</button>':'<span class="pill">معمل القضايا مقفول — حل FILE #0001 أولًا</span>'}</div></section>`}
function viewContent(){let titles={evidence:['كروت الأدلة','كل بطاقة تضيف قطعة جديدة إلى الصورة. بعض الأدلة لا تُفتح إلا بعد التقدم في التحقيق.'],interviews:['غرفة الاستجواب','قارن أقوال الشخصيات بما وجدته في السجلات والوثائق.'],timeline:['إعادة بناء الليلة','رتّب الأحداث ذهنيًا وافصل وقت الحدث عن وقت العرض والتسجيل.'],board:['لوحة ربط الأدلة','اجمع الدافع والفرصة والتناقض الزمني والأثر المادي.'],notebook:['دفتر المحقق','دوّن النظريات والأسئلة والتناقضات. تُحفظ ملاحظاتك على هذا الجهاز.'],final:['تقرير الاستنتاج النهائي','قدّم اسم المسؤول، واشرح كيف نفّذ الخطة، وأين أخفى الملف وشريف.'],roles:['الأدوار وقواعد الطاولة','قواعد مختصرة لتشغيل القضية في المود المنفرد أو الجماعي.']};let [title,desc]=titles[activeView];return `<div class="viewhead"><div><div class="eyebrow">CASE WORKSPACE / ${activeView.toUpperCase()}</div><h2>${title}</h2><p>${desc}</p></div><span class="pill">${state.mode==='solo'?'SOLO':'CARD TABLE'}</span></div><div class="content">${({evidence:evidenceView,interviews:interviewsView,timeline:timelineView,board:boardView,notebook:notebookView,final:finalView,roles:rolesView})[activeView]()}</div>`}
function evidenceView(){let cats=['الكل','القضية','زمني','وثائق','شهادات','حركة','مادي','رقمي','مكان','سري','استنتاج'];return `<div class="notice"><strong>نظام فتح المراحل:</strong> المرحلة الأولى متاحة من البداية، والثانية تُفتح بعد اكتشاف 3 أدلة، والثالثة بعد اكتشاف 7 أدلة. لا تتجاوز الأدلة المقفلة؛ ترتيب الكشف جزء من القضية.</div><div class="filterbar">${cats.map(c=>`<button class="filter ${filter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('')}</div><div class="cards">${CASE.evidence.filter(e=>filter==='الكل'||e.category===filter).map(e=>{let opened=state.revealed.includes(e.id),unlocked=e.stage<=state.stage;return `<button class="e-card ${!unlocked?'locked':''}" ${unlocked?`onclick="openEvidence('${e.id}')"`:''}><div><div class="cardtop"><span class="tag">${e.id}</span><span class="level">${!unlocked?'🔒 المرحلة '+e.stage:opened?'✓ تم الفتح':'المرحلة '+e.stage}</span></div><h3>${unlocked?e.title:'بطاقة مغلقة'}</h3><p>${unlocked?(opened?e.front:'اضغط لقلب البطاقة وقراءة تفاصيل الدليل.'):'اكتشف أدلة إضافية لفتح هذه المرحلة.'}</p></div><div class="cardbottom"><span>${e.type}</span><strong>${unlocked?(opened?'مراجعة الدليل':'فتح البطاقة'):'مقفل'}</strong></div></button>`}).join('')}</div>`}
function interviewsView(){let p=CASE.people[interviewPerson];let qs=[['احكِ لي عن علاقتك بشريف.','كل شخص لديه جانب من العلاقة لا يريد أن يُساء فهمه. اسأل عن التفاصيل القابلة للتحقق، لا الانطباعات العامة.'],['أين كنت بين 12:30 و1:10؟','التوقيت الذي تذكره قد يكون مبنيًا على شاشة متأثرة. اطلب حدثًا آخر مستقلًا يمكن ربطه بذكراه.'],['ما الذي تعرفه عن ملف المرآة؟','الملف يضم نسخًا متعارضة من اتفاقية قديمة. قارن الإجابة بما ورد في بطاقة الوثيقة الأصلية.'],['هل لاحظت اختلافًا في الساعات أو السجلات؟','لا يكفي أن يقول الشاهد إن الساعة كانت صحيحة. اسأله أي ساعة اعتمد عليها وكيف يمكن التحقق منها.'],['مَن يستفيد من اختفاء الملف؟','هذا سؤال عن الدافع فقط؛ لا تعتبر الإجابة دليلًا على التنفيذ.']];return `<div class="tabs">${CASE.people.map((x,i)=>`<button class="tab ${interviewPerson===i?'active':''}" onclick="choosePerson(${i})">${x.name}</button>`).join('')}</div><div class="cols"><div><div class="interview-card"><div class="eyebrow">INTERVIEW SUBJECT</div><h3>${p.name}</h3><span class="pill">${p.role}</span><p>${p.public}</p><p class="muted">مسار التحقيق: ${p.hint}</p></div><h3 style="font-size:14px">أسئلة الاستجواب</h3>${qs.map((q,i)=>`<button class="question" onclick="answerQuestion('${p.name}',${i})">＋ ${q[0]}</button><div class="answer hidden" id="ans-${interviewPerson}-${i}">${q[1]}<br><span class="muted">ملاحظة: هذه نقطة متابعة للمحقق وليست اعترافًا أو معلومة جديدة عن الشخصية.</span></div>`).join('')}</div><div class="box"><h3>سجل التناقضات</h3><p class="small muted">سجّل ما قالته الشخصية، ثم قارنه بدليل محدد. لا تنسب للشخص اعترافًا لم يرد في ملف القضية.</p><label class="field-label">ملاحظة عن ${p.name}</label><textarea class="field" placeholder="ما الذي قاله؟ ما الدليل الذي يؤيده أو يناقضه؟" onchange="saveSuspect('${p.name}',this.value)">${esc(state.suspectNotes[p.name]||'')}</textarea><button class="btn primary" style="margin-top:10px" onclick="toast('تم حفظ ملاحظة الاستجواب')">حفظ الملاحظة</button></div></div>`}
function timelineView(){let items=[['6:00 م','وصول الضيوف واستقرارهم في الفيلا. نقطة ثابتة في بداية الأمسية.'],['12:30 ص','بداية نافذة الاضطراب في عرض الوقت لبعض الأجهزة.'],['12:34 ص','شريف يراجع ملف المرآة في مكتبه، بينما يجعل سجل لاحق الحدث يبدو أقرب إلى 12:50.'],['12:41 ص','يمر مروان قرب الممر المؤدي إلى المكتب بحجة إجراء مكالمة.'],['12:47 ص','تترك سلمى ظرفًا على مكتب الاستقبال وفق تعليمات سابقة، ولا تعرف محتواه.'],['12:52 ص','حركة قصيرة يستغلها مروان لنقل الحافظة إلى مخبأ مؤقت.'],['12:58 ص','يصل ملف المرآة إلى خزانة ملفات قديمة في الممر الخلفي.'],['1:03 ص','يُبعد شريف عن مسار الحركة الرئيسي ويُحتجز في غرفة الأرشيف بملحق الضيافة.'],['1:08 ص','يتأكد مروان أن الرواية الظاهرة تبدو متماسكة.'],['1:14 ص','يلاحظ ياسين اختلافًا بين سجلين، لكنه يظنه خلل إعداد قديمًا.'],['1:31 ص — المعروض','تظهر على عدة أجهزة علامة زمنية مضللة.'],['1:38 ص','يبدأ القلق عندما لا يرد شريف.'],['1:45 ص','يُعلن أن شريف مفقود وأن المكتب كان مغلقًا.'],['صباح اليوم التالي','يُكتشف غياب ملف المرآة ويبدأ التحقيق.']];return `<div class="notice"><strong>تنبيه:</strong> الأوقات أدناه هي مرجع الحقيقة للمصمم. استخدمها لمراجعة استنتاجك، ولا تعتبر ترتيب العرض الظاهر على الأجهزة دليلًا مستقلًا على ترتيب الأحداث.</div><div class="timeline">${items.map((it,i)=>`<div class="timeitem"><time>${it[0]}</time><p>${it[1]}</p></div>`).join('')}</div><div class="box" style="margin-top:15px"><label class="field-label">ما أهم فرق بين الوقت الحقيقي والوقت المعروض؟</label><textarea class="field" placeholder="اكتب تفسيرك قبل الانتقال للاستنتاج النهائي..." onchange="state.timelineNote=this.value;save()">${esc(state.timelineNote||'')}</textarea><button class="btn" style="margin-top:10px" onclick="state.timelineDone=true;save();toast('تم حفظ ملاحظتك الزمنية')">تأكيد مراجعتي للخط الزمني</button></div>`}
function boardView(){let groups=[['الدافع',['ملف المرآة','نسختان من الاتفاقية','تسليم الأصل لمحامٍ مستقل']],['الفرصة',['مرور قرب الممر','نافذة الحركة القصيرة','الوصول إلى الخزانة القديمة']],['التناقض الزمني',['12:30 ثم 1:31','اختلاف سجلين','مرجع الاتصال الخارجي']],['الأثر والمسار',['أثر قرب الخزانة','لقطة كاميرا مقتطعة','غرفة الأرشيف']],['الشخصيات المضللة',['خلاف ليلى العائلي','قلق نادر المهني','ظرف سلمى','زيارة حازم الغامضة']]];return `<div class="notice">ضع كل معلومة في مكانها الصحيح، ثم راجع إن كان لديك دليل مستقل يدعم كل استنتاج. الدافع وحده لا يساوي الإدانة.</div><div class="board">${groups.map(g=>`<div class="boardcol"><h3>${g[0]}</h3>${g[1].map(x=>`<div class="boarditem">${x}</div>`).join('')}</div>`).join('')}</div><div class="box" style="margin-top:15px"><h3>سلسلة الاستنتاج</h3><label class="field-label">الدافع</label><input class="field" value="${esc(state.chainMotive||'')}" placeholder="مَن يستفيد من منع تسليم الملف؟" onchange="state.chainMotive=this.value;save()"><label class="field-label">الفرصة</label><input class="field" value="${esc(state.chainOpportunity||'')}" placeholder="ما الذي يربط الشخص بمسار الحركة؟" onchange="state.chainOpportunity=this.value;save()"><label class="field-label">التناقض الزمني</label><input class="field" value="${esc(state.chainTime||'')}" placeholder="أي مصدر يكشف التوقيت المضلل؟" onchange="state.chainTime=this.value;save()"><label class="field-label">الأثر المادي / المسار</label><input class="field" value="${esc(state.chainTrace||'')}" placeholder="ما القرينة التي تربط المسار بالفعل؟" onchange="state.chainTrace=this.value;save()"></div>`}
function notebookView(){return `<div class="cols"><div class="box"><h3>دفتر الملاحظات الرئيسي</h3><p class="small muted">اكتب النظريات والأسئلة التي لم تجد لها إجابة. يتم الحفظ تلقائيًا.</p><textarea class="field" style="min-height:300px" placeholder="ملاحظات المحقق...\n\n- حقيقة مؤكدة:\n- تناقض:\n- سؤال مفتوح:\n- فرضية تحتاج دليلًا:" oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea><div class="small muted" style="margin-top:8px">${state.notes.length} حرفًا · محفوظ محليًا</div></div><div class="box"><h3>الأدلة التي فتحتها</h3>${state.revealed.length?state.revealed.map(id=>{let e=CASE.evidence.find(x=>x.id===id);return `<div class="person"><div><strong>${e.id} · ${e.title}</strong><small>${e.type}</small></div><button class="btn" onclick="openEvidence('${e.id}')">عرض</button></div>`}).join(''):'<p class="empty">لم تفتح أي بطاقة بعد.</p>'}<button class="btn" style="margin-top:12px" onclick="exportNotes()">تصدير الملاحظات كملف نصي</button></div></div>`}
function finalView(){if(state.solved)return `<div class="secret"><strong>تم إنهاء القضية.</strong><br>يمكنك مراجعة الحل الكامل أدناه أو إعادة القضية لبدء جلسة جديدة. تم فتح معمل إنشاء القضايا.</div><button class="btn primary" style="margin:12px 0" onclick="createCase()">＋ إنشاء قضية جديدة</button>${solutionPanel()}`;return `<div class="notice"><strong>قبل تقديم الاتهام:</strong> تأكد أنك تستطيع الإجابة عن أربعة أسئلة: مَن لديه الدافع؟ مَن كانت لديه الفرصة؟ كيف ضُلّل التوقيت؟ وما القرائن المستقلة التي تربط الشخص بمسار الملف واختفاء شريف؟</div><div class="cols"><div class="box"><h3>تقرير المحقق</h3><label class="field-label">مَن تتهم؟</label><select class="field" onchange="state.accused=this.value;save()"><option value="">اختر المشتبه به</option>${CASE.people.map(p=>`<option ${state.accused===p.name?'selected':''}>${p.name}</option>`).join('')}</select><label class="field-label">فسّر كيف جرت الخطة</label><textarea class="field" placeholder="اشرح العلاقة بين التوقيت، واختفاء شريف، واختفاء ملف المرآة..." onchange="state.reason=this.value;save()">${esc(state.reason)}</textarea><label class="field-label">درجة ثقتك</label><select class="field" onchange="state.confidence=this.value;save()"><option value="">اختر درجة الثقة</option><option ${state.confidence==='منخفضة'?'selected':''}>منخفضة</option><option ${state.confidence==='متوسطة'?'selected':''}>متوسطة</option><option ${state.confidence==='عالية'?'selected':''}>عالية</option></select><button class="btn primary" style="width:100%;margin-top:15px" onclick="submitAccusation()">تثبيت الاتهام وكشف الحل</button></div><div class="box"><h3>قائمة التحقق</h3>${[['هل حددت الدافع التجاري؟',state.revealed.includes('E04')&&state.revealed.includes('E16')],['هل قارنت سجلات التوقيت؟',state.revealed.includes('E02')&&state.revealed.includes('E06')&&state.revealed.includes('E13')],['هل تتبعت مسار الملف؟',state.revealed.includes('E10')&&state.revealed.includes('E14')],['هل راجعت مسار اختفاء شريف؟',state.revealed.includes('E11')&&state.revealed.includes('E15')],['هل ربطت الدافع بالفرصة والأثر؟',state.revealed.includes('E08')&&state.revealed.includes('E10')&&state.revealed.includes('E16')]].map(([t,ok])=>`<div class="person"><div><strong>${t}</strong></div><span class="pill" style="${ok?'color:var(--green);border-color:#316d56':''}">${ok?'مكتمل':'غير مكتمل'}</span></div>`).join('')}<p class="small muted">يمكنك تقديم الاتهام في أي وقت، لكن اكتمال هذه النقاط يساعدك على بناء تفسير عادل ومدعوم.</p></div></div>`}
function solutionPanel(){return `<div class="box" style="margin-top:15px"><div class="eyebrow">CASE RESOLUTION / CLASSIFIED</div><h2 style="color:var(--pink)">الحقيقة النهائية</h2><h3>المسؤول: مروان المنشاوي</h3><p class="small" style="line-height:2">دبّر مروان إخفاء ملف المرآة والتلاعب في التسلسل الظاهر للأحداث لمنع تسليم الوثيقة إلى محامٍ مستقل. تكشف الوثيقة الأصلية أن روايته عن صفقة قديمة ناقصة ومضللة، وأنه استفاد من اختلاف نسختين من الاتفاقية.</p><h3>كيف حدث ذلك؟</h3><p class="small" style="line-height:2">لم يتوقف الزمن ولم يحدث شيء خارق. جرى التلاعب في عرض الوقت وترتيب ظهور بعض السجلات، بالتزامن مع خداع بشري. استغل مروان حركة قصيرة لنقل الحافظة من مكتب شريف إلى خزانة ملفات قديمة في الممر الخلفي، ثم نقلها إلى صندوق مستندات عادي في غرفة الأرشيف بملحق الضيافة.</p><h3>أين شريف؟</h3><p class="small" style="line-height:2">لم يُقتل شريف. أُبعد عن مسار الحركة الرئيسي وفق ترتيب سابق، واحتُجز مؤقتًا في غرفة أرشيف قديمة ضمن ملحق الضيافة الخلفي التابع للملكية العائلية.</p><h3>لماذا لم تكن القرائن الأخرى كافية؟</h3><p class="small" style="line-height:2">ليلى تخفي خلافًا عائليًا، ونادر يخشى على سمعته، وسلمى اعتمدت على شاشة متأثرة، وحازم يخفي سبب زيارته. أسرارهم تفسر الشكوك لكنها لا تثبت أنهم نفذوا الخطة. أما ياسين، فملاحظته عن اختلاف سجلين تقود إلى مرجع زمني مستقل، لكنها ليست وحدها دليل إدانة.</p><div class="secret">قاعدة الحل: الدافع وحده لا يكفي. يجب أن تجتمع قرائن الدافع والفرصة والأثر المادي والتناقض الزمني. مكان الملف لا يثبت وحده مَن أخفاه.</div><button class="btn" style="margin-top:12px" onclick="state.solved=false;state.accused='';state.reason='';save();render()">العودة إلى التقرير</button></div>`}
function rolesView(){if(state.mode==='solo')return `<div class="cols"><div class="box"><h3>قواعد المحقق المنفرد</h3><ol class="small" style="line-height:2.2"><li>ابدأ ببلاغ الاختفاء والأدلة المفتوحة.</li><li>افتح المرحلة الثانية بعد 3 أدلة، والثالثة بعد 7.</li><li>استخدم الاستجواب لتحديد أسئلة متابعة، لا لتوليد اعترافات غير موجودة.</li><li>اكتب الفرضية في دفتر الملاحظات.</li><li>قدّم الاتهام، ثم قارن تفسيرك بالحقيقة النهائية.</li></ol></div><div class="box"><h3>إعداد الجلسة</h3><p class="small muted">يمكنك إعادة تعيين القضية والبدء من جديد في أي وقت.</p><button class="btn danger" onclick="resetProgress()">إعادة تعيين التقدم</button></div></div>`;return `<div class="box"><h3>إعداد طاولة التحقيق</h3><label class="field-label">عدد اللاعبين</label><select class="field" onchange="groupCount=+this.value;state.groupCount=groupCount;save();render()">${[2,3,4,5,6].map(n=>`<option value="${n}" ${state.groupCount===n?'selected':''}>${n} لاعبين</option>`).join('')}</select><p class="small muted">التوزيع المقترح يتغير حسب عدد المشاركين. في النسخة الأصلية من القضية: 3 محققين ولاعب يؤدي دور المجرم.</p><div class="list">${roleAssignments().map((r,i)=>`<div class="role-card"><div class="eyebrow">PLAYER ${String(i+1).padStart(2,'0')}</div><h3>${r[0]}</h3><p>${r[1]}</p><button class="btn" onclick="revealRole(${i})">عرض بطاقة الدور</button><div id="role-${i}" class="hidden secret" style="margin-top:10px">${r[2]}</div></div>`).join('')}</div><div class="notice" style="margin-top:15px"><strong>سرية الأدوار:</strong> مرّر الجهاز للاعب صاحب الدور فقط عند فتح بطاقته. لا تفتحوا الحقيقة النهائية إلا بعد تثبيت الاتهام. اللاعب الذي يؤدي دور المجرم لا يختلق أدلة ولا يغيّر الحقيقة؛ بل يراوغ ضمن المعلومات التي كُشفت له.</div></div>`}
function roleAssignments(){let n=state.groupCount||4;let base=[['المحقق الرئيسي','يدير النقاش ويطلب تبرير كل استنتاج.','أنت مسؤول عن التمييز بين الوقائع والفرضيات. لا تتهم أحدًا دون قرائن مستقلة.'],['قارئ الأدلة','يفتح بطاقات الأدلة ويقرأ النص كاملًا.','اقرأ النص كما هو، ولا تضف تفسيرًا من عندك باعتباره حقيقة.'],['مسجل الملاحظات','يدوّن التناقضات والخط الزمني.','راقب الفرق بين وقت الحدث ووقت التسجيل ووقت العرض.'],['الدور السري','أنت تؤدي دور الشخص المتورط في إخفاء جزء من الحقيقة.','أنت مروان المنشاوي في الحقيقة الثابتة، لكن تفاصيل الخطة تُكشف لك تدريجيًا. لا تختلق أدلة ولا تناقض بطاقة ظاهرة.']];if(n===2)return [base[0],base[3]];if(n===3)return [base[0],base[1],base[3]];return [...base.slice(0,3),base[3],...Array.from({length:n-4},(_,i)=>[['مراجع التناقضات','يبحث عن تناقض بين شهادتين أو سجلين.','لا تعتبر التناقض إدانة قبل معرفة مصدر كل معلومة.'],['مدير الجولة','ينظم فتح الأدلة ويضمن عدم كشف الحل مبكرًا.','لا تفتح بطاقة مرحلة لاحقة قبل استيفاء شرط فتحها.']][i%2])].slice(0,n)}
function start(mode){state=fresh();state.mode=mode;state.started=true;state.stage=1;state.groupCount=mode==='group'?4:1;state.revealed=[];save();activeView='evidence';render();toast(mode==='solo'?'بدأ التحقيق المنفرد':'تم تجهيز طاولة الكروت')}
function go(v){activeView=v;render()}function setFilter(v){filter=v;render()}function choosePerson(i){interviewPerson=i;render()}function saveSuspect(n,v){state.suspectNotes[n]=v;save()}function answerQuestion(n,i){let el=document.getElementById(`ans-${interviewPerson}-${i}`);el.classList.toggle('hidden')}
function openEvidence(id){let e=CASE.evidence.find(x=>x.id===id);if(!e)return;if(e.stage>state.stage){toast('هذه البطاقة ما زالت مقفلة');return}if(!state.revealed.includes(id)){state.revealed.push(id);let count=state.revealed.length;if(count>=7)state.stage=3;else if(count>=3)state.stage=2;save()}document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">EVIDENCE CARD / ${e.id}</div><h2>${e.title}</h2><span class="pill">${e.type}</span></div><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody"><div class="evidence-meta"><span class="tag">${e.id}</span><span class="pill">المرحلة ${e.stage}</span><span class="pill">${e.category}</span></div><div class="evidence-body">${e.body}</div><div class="cluebox"><strong style="color:var(--green)">ما الذي يدعمه الدليل؟</strong><br>${e.proves}</div><div class="cluebox"><strong style="color:var(--gold)">حدود الدليل</strong><br>${e.limit}</div><div class="cluebox"><strong style="color:var(--pink)">ملاحظة للمحقق</strong><br>${e.clue}</div><label class="field-label">ملاحظتك على هذه البطاقة</label><textarea class="field" placeholder="اكتب استنتاجك أو سؤال المتابعة..." onchange="state.suspectNotes['${id}']=this.value;save()">${esc(state.suspectNotes[id]||'')}</textarea></div><div class="modalfoot"><span class="small muted">تم حفظ البطاقة ضمن الأدلة المفتوحة</span><button class="btn primary" onclick="closeModal();go('evidence')">العودة إلى الكروت</button></div></div></div>`;renderProgressOnly()}

function showHelp(){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">PLAYER GUIDE</div><h2>دليل تشغيل القضية</h2></div><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody"><h3>هدف التحقيق</h3><p class="small" style="line-height:2">اكتشف من أخفى ملف المرآة، وكيف استُخدم التوقيت المضلل، وأين انتهى مسار الملف وشريف. يجب أن تدعم كل نتيجة رئيسية بقرينتين مستقلتين على الأقل.</p><h3>المراحل</h3><p class="small" style="line-height:2">المرحلة 1: أدلة البداية. المرحلة 2: تفتح بعد 3 أدلة. المرحلة 3: تفتح بعد 7 أدلة. الحل النهائي لا يظهر إلا بعد تقديم اتهام مع تفسير.</p><h3>المود الجماعي</h3><p class="small" style="line-height:2">وزّعوا الأدوار، اقرأوا كل بطاقة بصوت واضح، وسجلوا الأدلة التي تؤيد أو تناقض كل فرضية. لا يسمح للاعب دور المجرم بتغيير الوقائع أو اختلاق أدلة.</p><h3>الحفظ</h3><p class="small" style="line-height:2">يُحفظ التقدم والملاحظات في المتصفح على الجهاز الحالي. استخدم زر تصدير الملاحظات للاحتفاظ بنسخة نصية.</p></div></div></div>`}

function editProfile(){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">INVESTIGATOR ID / VISUAL CUSTOMIZER</div><h2>تخصيص البروفايل وصورة اللعبة</h2></div><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody"><label class="field-label">اسم المحقق</label><input id="profileName" class="field" maxlength="30" value="${esc(profile.name||'')}" placeholder="اكتب اسمك"><label class="field-label">اختصار الشارة</label><input id="profileTag" class="field" maxlength="3" value="${esc(profile.tag||'CZ')}" placeholder="CZ"><div class="image-preview"><div class="profile-photo">${profileBadge()}</div><div style="flex:1;min-width:180px"><strong>صورة البروفايل</strong><p class="small muted">اختَر صورة من جهازك لتظهر بجوار اسم المحقق.</p><input id="avatarUpload" class="file-input" type="file" accept="image/*" onchange="readCustomImage(event,'avatar')"><button class="btn" style="margin-top:8px" onclick="clearCustomImage('avatar')">إزالة صورة البروفايل</button></div></div><div class="image-preview">${artwork?`<img src="${artwork}" alt="غلاف اللعبة الحالي">`:`<div class="profile-photo" style="width:76px;height:76px;flex-basis:76px">CZ</div>`}<div style="flex:1;min-width:180px"><strong>صورة غلاف اللعبة</strong><p class="small muted">بدّل صورة الغلاف بأي صورة عندك؛ لا تحتاج صورًا جاهزة داخل المشروع.</p><input id="artUpload" class="file-input" type="file" accept="image/*" onchange="readCustomImage(event,'artwork')"><button class="btn" style="margin-top:8px" onclick="clearCustomImage('artwork')">إزالة الغلاف</button></div></div><p class="small muted">الصور تُحفظ محليًا في المتصفح على هذا الجهاز. عند تصدير نسخة جديدة من اللعبة يمكن تضمين تخصيصاتك فيها.</p><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveProfile()">حفظ التخصيصات</button></div></div></div>`}
function readCustomImage(event,kind){const file=event.target.files&&event.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('اختَر ملف صورة صالحًا');return}if(file.size>8*1024*1024){toast('اختَر صورة أقل من 8MB');event.target.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.82);if(kind==='avatar')profile.avatar=data;else artwork=data;const name=document.getElementById('profileName')?.value;const tag=document.getElementById('profileTag')?.value;editProfile();if(name!==undefined)document.getElementById('profileName').value=name;if(tag!==undefined)document.getElementById('profileTag').value=tag;toast('تم تحميل الصورة وضغطها للمعاينة')};img.onerror=()=>toast('تعذر قراءة الصورة؛ جرّب ملفًا آخر');img.src=reader.result};reader.readAsDataURL(file)}
function clearCustomImage(kind){if(kind==='avatar')profile.avatar='';else{artwork='';persistArtwork()}editProfile();toast('تمت إزالة الصورة')}
function saveProfile(){profile={...profile,name:(document.getElementById('profileName').value||'المحقق الجديد').trim().slice(0,30),tag:(document.getElementById('profileTag').value||'CZ').trim().slice(0,3).toUpperCase()};try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile))}catch(e){toast('تعذر حفظ الصورة؛ اختَر صورة أصغر');return}persistArtwork();closeModal();render();toast('تم حفظ البروفايل والصور')}
function downloadGameInfo(){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">DOWNLOAD CENTER / WINDOWS + ANDROID</div><h2>مركز التحميل والتثبيت</h2></div><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody"><div class="app-notice">أنشئ نسخة HTML مستقلة من اللعبة. يمكنك نقل الملف إلى جهاز آخر وفتحه في المتصفح. إذا غيّرت الغلاف أو صورة البروفايل، استخدم زر التصدير بعد الحفظ لتضمينها داخل النسخة.</div><div class="download-grid"><div class="download-tile"><strong>▣ نسخة Windows</strong><p>تنزيل نسخة HTML مستقلة تعمل في Chrome أو Edge. لإبقاء الشفرات متاحة، احتفظ بملف cipher.html بجوارها أو نزّل الحزمة الكاملة.</p><button class="btn primary" style="width:100%" onclick="downloadGameCopy('windows')">تحميل لويندوز</button></div><div class="download-tile"><strong>▣ نسخة Android</strong><p>نسخة HTML للهاتف. للحصول على تثبيت كتطبيق، استضف مجلد web على HTTPS ثم اختر تثبيت التطبيق من المتصفح.</p><button class="btn primary" style="width:100%" onclick="downloadGameCopy('android')">تحميل لأندرويد</button></div></div><h3>تثبيت SHADOW FILES كتطبيق</h3><div class="install-status" id="installStatus">التثبيت كتطبيق PWA يحتاج تشغيل المشروع من HTTPS أو localhost. ملف HTML وحده ليس EXE أو APK.</div><div class="install-grid"><button class="btn primary" onclick="installCaseZero()">تثبيت التطبيق على هذا الجهاز</button><button class="btn" onclick="showInstallInstructions()">خطوات ويندوز وأندرويد</button></div><p class="small muted" style="line-height:2">ملف HTML يعمل مباشرة، أما تثبيت PWA فيحتاج استضافة آمنة. حزمة المشروع تتضمن ملفات مصدر لبناء نسخة Windows وAndroid؛ ملفات EXE/APK النهائية لا تُنتج إلا بعد عملية البناء بأدواتها.</p><h3>نسخ بياناتك</h3><button class="btn" onclick="exportNotes()">تحميل ملاحظات القضية TXT</button> <button class="btn" onclick="exportProgress()">تصدير التقدم JSON</button><p class="small muted" style="margin-top:12px">التقدم والبروفايل المحليان لا ينتقلان تلقائيًا بين الأجهزة؛ استخدم ملفات التصدير للاحتفاظ بنسخة.</p></div></div></div>`}
function downloadGameCopy(platform){try{const copy=document.documentElement.cloneNode(true);const embedded={profile,artwork};const scripts=copy.querySelectorAll('script');let main=null;for(const sc of scripts){if(sc.textContent.includes('const EMBEDDED_CUSTOMIZATION = null;')){main=sc;break}}if(main){main.textContent=main.textContent.replace('const EMBEDDED_CUSTOMIZATION = null; // filled into exported copies when needed','const EMBEDDED_CUSTOMIZATION = '+JSON.stringify(embedded).replace(/</g,'\\u003c')+'; // exported customization');}const html='<!doctype html>\n'+copy.outerHTML;const blob=new Blob([html],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=platform==='windows'?'SHADOW_FILES_Windows.html':'SHADOW_FILES_Android.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast(platform==='windows'?'بدأ تحميل نسخة ويندوز':'بدأ تحميل نسخة أندرويد')}catch(e){toast('تعذر إنشاء النسخة؛ جرّب متصفح Chrome أو Edge')}}

function createCase(){if(!state.solved){toast('حل القضية الأولى أولًا لفتح معمل القضايا');return}document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">CASE LAB / NEW FILE</div><h2>إنشاء قضية جديدة</h2></div><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody"><div class="notice"><strong>قالب قضية جديد:</strong> اكتب ملفًا جديدًا مستقلًا. لا يُضاف تلقائيًا إلى القصة الأصلية، وتُحفظ المسودة على هذا الجهاز فقط.</div><label class="field-label">عنوان القضية</label><input id="newCaseTitle" class="field" maxlength="90" placeholder="مثال: سر الغرفة المقفولة"><label class="field-label">المكان</label><input id="newCasePlace" class="field" maxlength="120" placeholder="المدينة / الموقع"><label class="field-label">ملخص البلاغ</label><textarea id="newCaseIntro" class="field" placeholder="ما الذي حدث؟ وما السؤال الذي يجب على المحققين الإجابة عنه؟"></textarea><label class="field-label">الشخصيات المشتبه بها (كل اسم في سطر)</label><textarea id="newCasePeople" class="field" placeholder="اسم الشخصية — دورها"></textarea><label class="field-label">الأدلة الأولية (كل دليل في سطر)</label><textarea id="newCaseEvidence" class="field" placeholder="مثال: سجل دخول يحمل توقيتًا متناقضًا"></textarea><label class="field-label">الحل السري للمصمم — لا تكتبه في الملخص</label><textarea id="newCaseSolution" class="field" placeholder="المسؤول، الدافع، الخطة، الحقيقة الزمنية، وكيف تثبتها الأدلة"></textarea><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveCustomCase()">حفظ القضية وتصدير ملفها</button></div></div></div>`}
function saveCustomCase(){const val=id=>document.getElementById(id).value.trim();const c={id:'CUSTOM-'+Date.now(),title:val('newCaseTitle'),place:val('newCasePlace'),intro:val('newCaseIntro'),people:val('newCasePeople').split('\n').map(x=>x.trim()).filter(Boolean),evidence:val('newCaseEvidence').split('\n').map(x=>x.trim()).filter(Boolean),solution:val('newCaseSolution'),createdAt:new Date().toISOString()};if(!c.title||!c.intro||c.people.length<2||c.evidence.length<2||c.solution.length<20){toast('أكمل العنوان والملخص وشخصيتين ودليلين والحل السري');return}let cases=[];try{cases=JSON.parse(localStorage.getItem('caseZeroCustomCasesV1')||'[]')}catch(e){}cases.push(c);localStorage.setItem('caseZeroCustomCasesV1',JSON.stringify(cases));const blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shadow-files-custom-'+c.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);closeModal();toast('تم حفظ مسودة القضية وتصدير ملفها')}

}

<script>
/* SHADOW FILES // ARCHIVE 101 + POINTS + PLAYABLE MINI CASES */

{id:2,title:'آخر قطار إلى المنصورة',place:'محطة مصر — القاهرة',genre:'اختفاء غامض',desc:'اختفت حقيبة تحتوي على دفتر حسابات قبل تحرك القطار بدقائق.',cost:40,story:'في الساعة 8:10 مساءً، أبلغ التاجر فؤاد نجيب عن اختفاء حقيبة جلدية من مقعده في عربة الدرجة الأولى. لم يغادر القطار الرصيف، وكان في العربة ثلاثة أشخاص فقط إلى جواره. الحقيبة لم تكن تحتوي على مال، بل دفترًا يثبت تلاعبًا في شحنة قمح.',clues:['كاميرا الرصيف تُظهر أن الحقيبة كانت بجوار المقعد حتى 8:06، ثم اختفت قبل إغلاق الأبواب.','عامل النظافة أكد أنه لم يدخل العربة بين 8:00 و8:12؛ وعربة الخدمة كانت مقفلة بختم سليم.','على المقعد بقيت دائرة جافة وسط غبار خفيف؛ ما يعني أن الحقيبة رُفعت عموديًا ولم تُسحب على الأرض.','تذكرة هاني ممزقة من طرفها، لكن سجل البوابة يثبت أنه لم يغادر الرصيف.'],suspects:[['هاني جابر','مساعد التاجر','قال إنه كان يبحث عن عربة الطعام من 8:00 حتى 8:10.'],['سلمى فوزي','موظفة التذاكر','قالت إنها لم تدخل العربة، وكانت عند شباك الرصيف.'],['ماهر صبري','عامل صيانة','قال إنه أصلح مصباحًا خارج العربة ولم يقترب من المقاعد.'],['عادل رجب','مسافر','قال إنه لم يتحرك من مقعده منذ 7:55.']],culprit:0,solution:'هاني هو الوحيد الذي ادعى البحث عن عربة الطعام، لكن عربة الطعام لم تكن قد فُتحت قبل تحرك القطار. كما أن وجوده داخل الرصيف ثابت، ما أتاح له العودة سريعًا إلى مقعده. رفع الحقيبة عموديًا يفسر اختفاءها دون أثر سحب.'},
{id:3,title:'لوحة بلا توقيع',place:'متحف النخيل للفنون',genre:'قطعة فنية مفقودة',desc:'اختفت لوحة صغيرة من قاعة مغلقة، بينما بقي إطارها معلقًا.',cost:40,story:'أثناء جولة مسائية، اكتشف أمين المتحف أن لوحة «الحديقة الزرقاء» اختفت من إطارها. القاعة لم تُفتح للجمهور بعد السادسة، ونظام الإنذار لم يسجل كسرًا أو فتحًا بالقوة.',clues:['الإطار سليم، لكن مشبكي التثبيت أُزيلا بأداة دقيقة لا تُستخدم في أعمال التنظيف.','سجل المخزن يثبت خروج مجموعة أدوات ترميم الساعة 5:20 وعودتها 5:47.','الغبار خلف الإطار متصل بلا انقطاع؛ إذن اللوحة أزيلت قبل آخر عملية تنظيف موثقة عند 5:00.','في صورة توثيقية التُقطت 5:12 تظهر اللوحة بالفعل داخل الإطار.'],suspects:[['داليا مراد','مرممة','قالت إنها أعادت أدواتها قبل السادسة ولم تلمس اللوحة.'],['يوسف حمدي','أمين القاعة','قال إنه راجع الإطار بعد الجولة عند 6:15.'],['رامي كمال','مسؤول الإضاءة','قال إن عمله اقتصر على تغيير مصباح المدخل.'],['منى عادل','منسقة المعرض','قالت إنها غادرت المتحف عند 5:30.']],culprit:0,solution:'داليا أخذت أدوات الترميم قبل عودة اللوحة في الصورة عند 5:12؟ الأدلة تثبت اللوحة موجودة 5:12، ثم اختفت قبل الجولة. لكنها صاحبة الأداة الدقيقة الوحيدة التي خرجت من المخزن، وعبارة «أعدت أدواتي قبل السادسة» لا تنفي استخدامها قبل ذلك. الأثر على المشبكين يطابق أداة الترميم.'},
{id:4,title:'رسالة عند منتصف الليل',place:'مبنى الإذاعة القديم',genre:'ابتزاز مجهول',desc:'وصلت رسالة تهديد إلى المذيع من داخل المبنى رغم انقطاع الشبكة.',cost:50,story:'تلقى المذيع نادر خطابًا ورقيًا يطالبه بتسليم تسجيل قديم قبل منتصف الليل. قال الجميع إن المبنى كان بلا زوار، وإن باب الاستوديو ظل مغلقًا.',clues:['الظرف مختوم بشمع أزرق لا يوجد إلا في غرفة الأرشيف.','الطابعة التي أخرجت الرسالة سجلت آخر مهمة عند 11:42، بينما انقطعت الشبكة 11:30.','ورقة المسودة تحمل أثر دبوس من لوحة إعلانات غرفة الأرشيف.','الحارس سجل دخول شخص واحد إلى غرفة الأرشيف عند 11:35 ببطاقة داخلية.'],suspects:[['باسم لطفي','مهندس صوت','قال إنه كان في غرفة التحكم طوال فترة الانقطاع.'],['نهى سامي','باحثة أرشيف','قالت إنها دخلت الأرشيف لاستعادة ملف ثم خرجت فورًا.'],['شادي عاطف','حارس','قال إنه لم يغادر البوابة ولم يستخدم الطابعة.'],['نادر فؤاد','مذيع','قال إنه لم يقترب من الأرشيف منذ أسبوع.']],culprit:1,solution:'نهى دخلت غرفة الأرشيف عند 11:35، وهي الوحيدة التي تملك وصولًا طبيعيًا إلى الشمع الأزرق ولوحة الإعلانات. الطابعة عملت محليًا بعد انقطاع الشبكة، لذلك لا ينفي الانقطاع طباعة الرسالة.'},
{id:5,title:'الخزنة ذات المفتاحين',place:'شركة الشرق للاستيراد',genre:'سرقة مستندات',desc:'اختفى عقد أصلي من خزنة تتطلب مفتاحين مستقلين.',cost:50,story:'اختفى عقد شراكة أصلي من خزنة الإدارة. فتح الخزنة يتطلب مفتاح المدير ورمز المحاسب في الوقت نفسه. لا توجد آثار عبث بالقفل.',clues:['سجل الخزنة يثبت استخدام المفتاح والرمز الساعة 7:18 مساءً.','المدير كان في بث مباشر متصل من مكتبه بين 7:00 و7:30، وتظهر يداه باستمرار.','الرمز أُدخل من لوحة المفاتيح، لكن سجل النظام يبين أن المحاولة الأولى كانت خاطئة ثم نجحت بعد 14 ثانية.','نسخة المفتاح الاحتياطي لم تغادر درج السكرتارية، وختم الدرج سليم؛ لكن سجل العهدة يثبت أن نسخة إدارية ثانية سُلّمت للمحاسب قبل أسبوع.'],suspects:[['عمر الديب','المحاسب','قال إنه غادر عند السابعة ولم يعد.'],['سحر نبيل','سكرتيرة المدير','قالت إنها لم تلمس درج المفاتيح.'],['فارس أمين','مدير الشركة','قال إنه لم يترك البث المباشر.'],['ماجد رؤوف','موظف الأرشيف','قال إنه لم يكن يعرف أن العقد داخل الخزنة.']],culprit:0,solution:'عمر كان يعرف الرمز، وكان يستطيع استخدام المفتاح الذي تركه المدير في الخزنة الإدارية أثناء البث؟ لكن الخزنة تتطلب المفتاح والرمز؛ البث يثبت أن المدير لم يفتحها. التحقيق يكشف أن المحاسب احتفظ بالنسخة الإدارية المسلّمة له، والمحاولة الخاطئة ثم الصحيحة تتوافق مع تجربته للرمز.'},
{id:6,title:'النافذة التي لم تُفتح',place:'فندق الميناء — الغرفة 407',genre:'حادث مستحيل',desc:'عُثر على عقد مفقود في غرفة مغلقة من الداخل، والنافذة بدت مفتوحة.',cost:60,story:'اختفى عقد من حقيبة نزيل، ثم وُجد داخل الغرفة نفسها بعد ساعة. الباب كان مقفلًا من الداخل، والنافذة تطل على شارع مزدحم في الطابق الرابع.',clues:['طبقة الغبار على حافة النافذة متصلة؛ لم تُفتح النافذة تلك الليلة.','قفل الباب يسجل فتحًا ببطاقة خدمة الساعة 9:06، ثم إغلاقًا من الداخل عند 9:09.','كاميرا المصعد تُظهر عربة تنظيف متوقفة أمام الغرفة في 9:04.','العقد وُضع داخل غلاف الفندق المجاني، والغلاف لا يوجد إلا في عربة التنظيف.'],suspects:[['ليلى حسان','النزيل','قالت إنها لم تغادر الغرفة.'],['محمود ربيع','عامل النظافة','قال إنه لم يدخل الغرفة لأن النزيل طلب الخصوصية.'],['طارق شوقي','موظف الاستقبال','قال إنه لم يغادر المكتب.'],['هبة عادل','مشرفة الطوابق','قالت إنها استخدمت بطاقة الخدمة لفحص تسرب مياه.']],culprit:3,solution:'هبة استخدمت بطاقة الخدمة بحجة فحص المياه، ثم أعادت ترتيب المشهد لتبدو النافذة طريق الدخول. الغبار يثبت أنها لم تُفتح، وغلاف الفندق يربط نقل العقد بعربة الخدمة.'},
{id:7,title:'الصوت القادم من المخزن',place:'مسرح البلد',genre:'تلاعب بالتسجيلات',desc:'سمع الحراس صوتًا من مخزن مغلق بعد إخلاء المسرح.',cost:60,story:'بعد انتهاء العرض وإخلاء المبنى، سمع الحارس صوت الممثل الراحل من داخل مخزن الملابس. عند فتحه لم يجد أحدًا، لكن شريطًا أصليًا اختفى.',clues:['الصوت تكرر كل 6 دقائق بنفس التوقف والتنفس؛ ما يشير إلى تشغيل تسجيل لا شخص حي.','جهاز التشغيل لا يعمل إلا ببطارية محمولة، والبطارية الوحيدة المسجلة كانت مع فني الصوت.','باب المخزن لم يُفتح بعد إغلاقه، لكن فتحة التهوية تسمح بتمرير جهاز صغير فقط.','الشريط المفقود كان محفوظًا في درج لا يُفتح إلا بمفتاح أمين الملابس.'],suspects:[['فادي ناصر','فني صوت','قال إنه سلّم البطارية قبل الإخلاء.'],['رنا كمال','أمينة ملابس','قالت إنها أغلقت الدرج وأخذت المفتاح معها.'],['حسن علي','حارس','قال إنه سمع الصوت ولم يدخل المخزن.'],['سامي جلال','ممثل','قال إنه غادر قبل نهاية العرض.']],culprit:0,solution:'فادي استخدم البطارية لتشغيل التسجيل عبر فتحة التهوية لصرف الحارس، لكنه لم يستطع فتح درج الملابس. المفتاح كان مع رنا، إلا أن الشريط كان قد نُقل مسبقًا إلى جهاز الصوت أثناء اختبار التسجيل؛ سجل المعدات يثبت أن فادي استعار الشريط قبل العرض.'},
{id:8,title:'ثلاث نسخ من الحقيقة',place:'دار النشر — وسط البلد',genre:'تزوير وثائق',desc:'ظهرت ثلاث نسخ مختلفة من صفحة واحدة في كتاب قبل الطباعة.',cost:70,story:'قبل إرسال كتاب تاريخي إلى المطبعة، اكتشف المحرر ثلاث نسخ متضاربة من الصفحة 88. إحداها تتضمن فقرة لم يكتبها المؤلف، وتغيّر معنى واقعة مهمة.',clues:['النسخة المزورة تستخدم خطًا لا يوجد على أجهزة التحرير، لكنه مثبت على حاسوب التدقيق اللغوي.','بيانات الملف تقول إنه أُنشئ 2:14، بينما صاحبه كان في اجتماع مسجل حتى 2:30.','الفقرة المزورة تحتوي على خطأ إملائي ورد في ملاحظة داخلية أرسلها المدقق إلى نفسه فقط.','سجل الطباعة يثبت أن النسخة خرجت من طابعة غرفة التدقيق الساعة 2:19.'],suspects:[['مها فؤاد','مدققة لغوية','قالت إنها لم تفتح الملف بعد الاجتماع.'],['إيهاب سامي','محرر','قال إنه لم ير الملاحظة الداخلية.'],['وليد رجب','مصمم','قال إنه كان يعمل على الغلاف في جهاز آخر.'],['نجلاء عادل','مديرة النشر','قالت إنها لم تدخل غرفة التدقيق.']],culprit:0,solution:'مها هي من كتبت الملاحظة الداخلية التي لم يطلع عليها غيرها، والنسخة خرجت من طابعة غرفة عملها. توقيت الاجتماع لا يمنع إنشاء الملف من جهازها قبل الاجتماع أو عبر مهمة مجدولة، لكن الخطأ الخاص بالملاحظة يحدد مصدر التزوير.'},
{id:9,title:'اختفاء في الدور السابع',place:'برج السحاب الإداري',genre:'اختفاء موظف',desc:'اختفى موظف من طابق لا يملك سوى مصعد واحد وسلّم مراقب.',cost:70,story:'دخل الموظف سامح البرج عند 6:40 مساءً، وصعد إلى الدور السابع. بعد عشر دقائق اختفى، ولم يظهر في تسجيل الخروج أو كاميرات المدخل.',clues:['كاميرا المصعد تتوقف 6:48 لمدة 90 ثانية بسبب إعادة تشغيل مجدولة.','باب السلم لا يسجل فتحًا بين 6:40 و7:10.','سجل مواقف السيارات يرصد خروج سيارة خدمة من البوابة الخلفية 6:56.','بطاقة سامح استُخدمت في المصعد للصعود فقط؛ لم تستخدم للنزول.'],suspects:[['معتز شريف','مسؤول تقنية','قال إن توقف الكاميرا آلي ومعلن.'],['دينا عادل','مديرة الموارد','قالت إنها غادرت قبل سامح.'],['جمال صبري','سائق خدمة','قال إنه لم يغادر موقف السيارات.'],['سلمى نادر','موظفة استقبال','قالت إنها لم تر سامح بعد صعوده.']],culprit:2,solution:'جمال أخرج سامح داخل سيارة الخدمة من البوابة الخلفية أثناء توقف كاميرا المصعد. لم يحتج إلى استخدام السلم أو بطاقة النزول، لذلك لا يظهر سامح في تسجيل الخروج.'},
{id:10,title:'الختم الأحمر',place:'محكمة السجلات القديمة',genre:'تلاعب بأدلة',desc:'استُبدلت صفحة من ملف قضية دون كسر ختم الحفظ.',cost:80,story:'اكتشف الباحث أن صفحة أساسية من ملف قديم استُبدلت، رغم أن الختم الأحمر على غلاف الملف يبدو سليمًا. ثلاثة موظفين تعاملوا مع الملف خلال الأسبوع.',clues:['الختم سليم من الأمام، لكن حافته الخلفية تحمل طبقة شمع ثانية.','الملف أُخرج للتصوير يوم الثلاثاء، وعاد بوزن أقل بمقدار ورقة واحدة.','آلة التصوير تسجل أن نسخة الملف أُرسلت إلى بريد داخلي لا يخص قسم التصوير.','الصفحة البديلة ورقها أحدث من بقية الملف، لكنها تحمل رقم أرشفة صحيحًا.'],suspects:[['صفوت مرسي','أمين السجلات','قال إنه لم يفتح الملف بعد إغلاقه.'],['إيمان رجب','موظفة تصوير','قالت إنها أعادت الملف كما تسلمته.'],['نبيل عادل','باحث قانوني','قال إنه لم يلمس الملف الأصلي.'],['حسام فوزي','فني حفظ','قال إنه أصلح الغلاف فقط.']],culprit:3,solution:'حسام أعاد ختم الغلاف بطبقة شمع ثانية بعد استبدال الصفحة. اختلاف طبقة الشمع يثبت إعادة الإغلاق، ووزن الملف قبل وبعد التصوير يحدد وقت الاستبدال. كما أن الورق الحديث ورقم الأرشفة الصحيح يشيران إلى شخص لديه صلاحية تجهيز صفحات بديلة، وهي ضمن عمل فني الحفظ.'}
];

for(let n=11;n<=101;n++){let k=n-11,a=titlesA[k%titlesA.length],b=titlesB[Math.floor(k/titlesA.length)%titlesB.length];caseList.push({id:n,title:a+' '+b,place:places[(n*7)%places.length],genre:genres[(n*3)%genres.length],desc:`ملف قيد التطوير من الأرشيف ${String(n).padStart(3,'0')}. ستُضاف له قصة وأدلة مستقلة في تحديث لاحق.`,cost:30+((n*7)%6)*10,original:false});}
function store(){localStorage.setItem(SF_POINTS,String(sfPoints));localStorage.setItem(SF_UNLOCKS,JSON.stringify(sfUnlocks));localStorage.setItem(SF_DONE,JSON.stringify(sfDone));updateWallet()}
function reward(id,amount){if(sfDone.includes(id))return false;sfDone.push(id);sfPoints+=amount;store();return true}
function updateWallet(){document.querySelectorAll('[data-sf-wallet]').forEach(e=>e.textContent=sfPoints+' نقطة')}
function wallet(){return `<span class="sf-wallet">✦ <span data-sf-wallet>${sfPoints} نقطة</span></span>`}
function injectTop(){const actions=document.querySelector('.top-actions');if(actions&&!document.getElementById('sfArchiveTop')){let b=document.createElement('button');b.id='sfArchiveTop';b.className='btn';b.textContent='▦ أرشيف القضايا 101';b.onclick=showArchive;actions.prepend(b);let w=document.createElement('span');w.className='sf-wallet';w.innerHTML='✦ <span data-sf-wallet>'+sfPoints+' نقطة</span>';actions.prepend(w)}}
const originalHome=window.home;
if(typeof originalHome==='function')window.home=function(){return `<div class="sf-profile-strip"><div><div class="eyebrow">SHADOW FILES // CLASSIFIED ARCHIVE</div><strong>أهلًا أيها المحقق — الأرشيف مفتوح</strong><div class="small muted">101 ملف · نقاط خبرة · فتح قضايا · حفظ التقدم على هذا الجهاز</div></div>${wallet()}<button class="btn primary" onclick="showArchive()">دخول أرشيف القضايا ↗</button></div>`+originalHome()+`<section class="sf-archive"><div class="sf-archive-head"><div><div class="eyebrow">THE 101 CASE ARCHIVE</div><h2>أرشيف الظل <span style="color:var(--sf-cyan)">101</span></h2><p>حل القضايا، اجمع نقاط الخبرة، وافتح ملفات جديدة. كل تقدمك محفوظ على هذا الجهاز.</p></div><button class="btn primary" onclick="showArchive()">استعراض كل القضايا</button></div><div class="sf-progress-line"><i style="width:${Math.min(100,sfDone.length/101*100)}%"></i></div><div class="small muted">تم حل ${sfDone.length} من 101 قضية · لديك ${sfPoints} نقطة</div></section>`}
const originalRender=window.render;
if(typeof originalRender==='function')window.render=function(){if(sfActive>1){renderMiniCase();return}originalRender();injectTop();updateWallet()}
const originalSubmit=window.submitAccusation;
if(typeof originalSubmit==='function')window.submitAccusation=function(){let was=!!state.solved;originalSubmit();if(!was&&state.solved&&state.accused==='مروان المنشاوي'){if(reward(1,100)){toast('إنجاز! ربحت 100 نقطة خبرة للقضية الأولى ✦');setTimeout(()=>{injectTop();updateWallet()},50)}}};
window.showArchive=function(){sfActive=0;let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(1120px,100%);max-height:92vh;overflow:auto"><div class="modalhead"><div><div class="eyebrow">SHADOW FILES / CENTRAL ARCHIVE</div><h2>أرشيف القضايا — 101 ملف</h2><div class="small muted">افتح الملفات بالنقاط المكتسبة من التحقيقات.</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${wallet()}<button class="btn" onclick="closeModal()">✕</button></div></div><div class="modalbody"><div class="sf-filter"><button class="${sfFilter==='all'?'active':''}" onclick="setSFfilter('all')">كل القضايا</button><button class="${sfFilter==='open'?'active':''}" onclick="setSFfilter('open')">المفتوحة</button><button class="${sfFilter==='locked'?'active':''}" onclick="setSFfilter('locked')">المقفولة</button><button class="${sfFilter==='done'?'active':''}" onclick="setSFfilter('done')">المحلولة</button></div><div class="sf-progress-line"><i style="width:${Math.min(100,sfDone.length/101*100)}%"></i></div><div class="small muted">${sfDone.length}/101 محلولة · ${sfUnlocks.length}/101 مفتوحة · الرصيد: ${sfPoints} نقطة</div><div class="sf-case-grid">${caseList.filter(c=>sfFilter==='all'||(sfFilter==='open'&&sfUnlocks.includes(c.id)&&!sfDone.includes(c.id))||(sfFilter==='locked'&&!sfUnlocks.includes(c.id))||(sfFilter==='done'&&sfDone.includes(c.id))).map(c=>caseCard(c)).join('')}</div></div></div></div>`};
function caseCard(c){let open=sfUnlocks.includes(c.id),done=sfDone.includes(c.id);return `<article class="sf-case-card ${open?'unlocked':''} ${!open?'locked':''} ${done?'completed':''}"><div class="sf-case-num">FILE #${String(c.id).padStart(3,'0')} · ${c.original?'ORIGINAL CASE':'ARCHIVE CASE'}</div><h3>${c.title}</h3><p>${c.desc}</p><div class="sf-case-foot"><span class="sf-pill">${c.genre}</span><span>${done?'✓ محلولة':open?'◈ مفتوحة':'🔒 '+c.cost+' نقطة'}</span></div><button class="btn ${open?'primary':''}" onclick="${open?`playSFCase(${c.id})`:`unlockSFCase(${c.id})`}">${done?'إعادة اللعب':open?'فتح الملف':'فتح مقابل '+c.cost+' نقطة'}</button></article>`}
window.setSFfilter=function(v){sfFilter=v;showArchive()};
window.unlockSFCase=function(id){let c=caseList.find(x=>x.id===id);if(!c)return;if(!c.original){toast('هذا الملف ضمن الأرشيف القادم، ولم تُجهّز قضيته بعد.');return}if(sfUnlocks.includes(id)){showArchive();return}if(sfPoints<c.cost){toast(`تحتاج ${c.cost-sfPoints} نقطة إضافية لفتح هذه القضية`);return}if(!confirm(`فتح ${c.title} مقابل ${c.cost} نقطة؟`))return;sfPoints-=c.cost;sfUnlocks.push(id);store();showArchive();toast('تم فتح الملف '+String(id).padStart(3,'0'))};
window.playSFCase=function(id){let c=caseList.find(x=>x.id===id);if(!c||!c.original||!sfUnlocks.includes(id))return;if(id===1){closeModal();sfActive=0;if(typeof start==='function')start('solo');return}sfActive=id;sfChosen=-1;closeModal();renderMiniCase()};
function makeMini(id){const c=caseList.find(x=>x.id===id);return authoredCases.find(x=>x.id===id)||{...c,story:'هذه القضية لم تُجهّز للعب بعد.',clues:[],suspects:[],culprit:-1,solution:''}}
function renderMiniCase(){let x=makeMini(sfActive),done=sfDone.includes(sfActive);document.getElementById('app').innerHTML=`<section class="sf-challenge"><div class="sf-archive-head"><div><div class="eyebrow">CLASSIFIED CASE FILE / #${String(sfActive).padStart(3,'0')}</div><h2>${x.title}</h2><div class="small muted">${x.place} · ${x.genre}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${wallet()}<button class="btn" onclick="showArchive()">← الأرشيف</button></div></div><div class="sf-clue"><b>ملخص الواقعة</b><br>${x.story}</div><h3>▤ أدلة التحقيق</h3>${x.clues.map((v,i)=>`<div class="sf-clue"><b>الدليل ${String(i+1).padStart(2,'0')}</b><br>${v}</div>`).join('')}<h3>◉ إفادات المشتبه بهم</h3><div class="sf-suspects">${x.suspects.map((p,i)=>`<button class="sf-suspect ${sfChosen===i?'selected':''}" onclick="chooseSFSuspect(${i})"><div class="sf-case-num">SUSPECT 0${i+1}</div><strong>${p[0]}</strong><div class="small muted">${p[1]}</div><div class="small" style="margin-top:7px;line-height:1.8;color:#c8bdd6">${p[2]}</div></button>`).join('')}</div>${done?`<div class="sf-result"><strong>✓ سبق إنهاء هذه القضية.</strong><br>${x.solution}<br>لا تُمنح مكافأة ثانية عند إعادة التحقيق.</div>`:''}<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" onclick="submitSFCase()">تثبيت الاستنتاج</button><button class="btn" onclick="showArchive()">العودة للأرشيف</button></div><div id="sfResult"></div><div class="small muted" style="margin-top:16px">المكافأة: ${sfActive===2?50:sfActive===3?50:sfActive===4?60:sfActive===5?60:sfActive===6?70:sfActive===7?70:sfActive===8?80:sfActive===9?80:100} نقطة عند الحل الصحيح لأول مرة.</div></section>`;injectTop();updateWallet()}
window.chooseSFSuspect=function(i){sfChosen=i;renderMiniCase()};
window.submitSFCase=function(){if(sfChosen<0){toast('اختَر مشتبهًا به أولًا');return}let x=makeMini(sfActive),el=document.getElementById('sfResult');if(sfChosen===x.culprit){let amount=sfActive<=3?50:sfActive<=5?60:sfActive<=7?70:sfActive<=9?80:100;let first=reward(sfActive,amount);el.innerHTML=`<div class="sf-result"><strong>✓ تم حل القضية بنجاح!</strong><br>${x.solution}<br>${first?'ربحت '+amount+' نقطة خبرة ✦':'هذه القضية محلولة بالفعل، لذلك لا توجد مكافأة إضافية.'}</div><button class="btn primary" style="margin-top:12px" onclick="showArchive()">العودة للأرشيف</button>`;if(first)toast('+'+amount+' نقطة خبرة')}else{el.innerHTML=`<div class="sf-result" style="border-color:#ff818b;background:#35151b66"><strong>الاستنتاج غير مدعوم بالأدلة.</strong><br>راجع التسلسل الزمني، وافصل بين ما تعرفه من دليل وما يقوله المشتبه به.</div>`;toast('الأدلة لا تدعم هذا الاتهام — حاول مجددًا')}};
// Add archive entry to the main home and header after every regular render.
setTimeout(()=>{injectTop();updateWallet()},0);
})();
</script>

<script>

(()=>{'use strict';
const riddles=[
{q:'تدريب القضية 002 — اختفاء الحقيبة: الكاميرا تثبت أن الحقيبة بقيت بجوار المقعد حتى 8:06، وعربة الخدمة كانت مختومة، وعامل النظافة لم يدخل العربة. أي استنتاج تدعمه الأدلة أكثر؟',opts:['أن الحقيبة سُحبت إلى خارج القطار عبر النافذة','أن شخصًا قريبًا من المقعد رفع الحقيبة قبل إغلاق الأبواب','أن عامل النظافة أخذها أثناء تنظيف العربة','أن الحقيبة لم تكن موجودة أصلًا'],a:1,why:'الأدلة تحدد نافذة الاختفاء بين 8:06 وإغلاق الأبواب، وتستبعد عربة الخدمة والتنظيف. كما أن الدائرة الجافة تشير إلى رفع الحقيبة من موضعها لا سحبها.'},

{q:'تدريب القضية 004 — رسالة منتصف الليل: انقطعت الشبكة 11:30، لكن الطابعة سجلت مهمة 11:42. ما التفسير التقني الذي يجب أن يختبره المحقق قبل استبعاد الطباعة؟',opts:['أن الطابعة لا يمكنها العمل دون إنترنت','أن المهمة ربما أُرسلت محليًا إلى الطابعة دون اتصال الشبكة','أن ساعة الطابعة متوقفة بالضرورة','أن الرسالة طُبعت قبل 11:30 حتمًا'],a:1,why:'انقطاع الشبكة لا يعني بالضرورة توقف الاتصال المحلي أو ذاكرة الطابعة. يجب فحص سجل المهام المحلية ومصدر أمر الطباعة.'},

{q:'تدريب القضية 006 — النافذة التي لم تُفتح: الغبار على حافة النافذة متصل، وقفل الباب يسجل بطاقة خدمة عند 9:06، وكاميرا المصعد تُظهر عربة تنظيف أمام الغرفة عند 9:04. أي فرضية تتفق مع الأدلة أكثر؟',opts:['الدخول عبر النافذة ثم إعادة الغبار كما كان','استخدام صلاحية بطاقة الخدمة للدخول، ثم وضع العقد داخل غلاف الفندق','دخول النزيل من الشارع عبر النافذة','عدم دخول أي شخص إلى الغرفة'],a:1,why:'الغبار المتصل يناقض فتح النافذة، بينما سجل بطاقة الخدمة وتوقيت عربة التنظيف وغلاف الفندق تربط الواقعة بمسار الخدمة.'}

function openQuiz(){idx=0;answered=false;score=0;drawQuiz();}
function drawQuiz(){let done=Object.keys(results).filter(k=>results[k]).length;let root=document.getElementById('modalRoot');if(!root)return;let r=riddles[idx];root.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(900px,100%);max-height:94vh;overflow:auto"><div class="modalhead"><div><div class="eyebrow">SHADOW INTELLIGENCE LAB / IQ-05</div><h2>أكاديمية المحققين</h2><div class="small muted">خمسة تدريبات تحقيق مستوحاة من ملفات الأرشيف — تعلّم قراءة الدليل وكشف التناقض.</div></div><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody"><section class="sf-quiz-wrap"><div class="sf-quiz-head"><div><div class="eyebrow">COGNITIVE CHALLENGE</div><h2>تدرّب على التفكير كمحقق</h2></div><div class="sf-quiz-meta"><span class="sf-quiz-chip">السؤال ${idx+1} / 5</span><span class="sf-quiz-chip">✦ ${score} نقطة هذه الجولة</span></div></div><div class="sf-quiz-progress"><i style="width:${idx/5*100}%"></i></div><article class="sf-riddle"><div class="sf-riddle-number">CASE TRAINING // 0${idx+1}</div><h3>${r.q}</h3><div class="sf-riddle-options">${r.opts.map((o,i)=>`<button class="sf-riddle-option" id="sfOpt${i}" onclick="window.sfAnswer(${i})">${['A','B','C','D'][i]} — ${o}</button>`).join('')}</div><div id="sfQuizFeedback"></div></article><div class="sf-quiz-actions"><button class="btn" onclick="closeModal()">إنهاء الاختبار</button><button class="btn primary" id="sfNext" disabled onclick="window.sfNext()">${idx===4?'عرض النتيجة':'السؤال التالي ←'}</button></div><div class="small muted" style="margin-top:12px">تدريبات أُنجزت سابقًا: ${done} / 5 · كل تدريب يمنح 20 نقطة لأول إجابة صحيحة فقط.</div></section></div></div></div>`;}
window.sfAnswer=function(choice){if(answered)return;answered=true;let r=riddles[idx],ok=choice===r.a;document.querySelectorAll('.sf-riddle-option').forEach((b,i)=>{b.disabled=true;if(i===r.a)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});let first=!results[idx]&&ok;if(first){results[idx]=true;localStorage.setItem(RKEY,JSON.stringify(results));score+=20;try{let k='shadowFilesPointsV1',p=Number(localStorage.getItem(k)||0);localStorage.setItem(k,String(p+20))}catch{}}document.getElementById('sfQuizFeedback').innerHTML=`<div class="sf-quiz-feedback" style="border-color:${ok?'#65c99a':'#bd6473'}"><b>${ok?'إجابة صحيحة!':'ليست الإجابة الصحيحة.'}</b> ${first?'<span class="sf-quiz-score">+20 نقطة</span>':ok?'سبق احتساب مكافأة هذا اللغز.':''}<br>${r.why}</div>`;document.getElementById('sfNext').disabled=false;};
window.sfNext=function(){if(!answered)return;if(idx<4){idx++;answered=false;drawQuiz();return}document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalbody"><section class="sf-quiz-wrap" style="text-align:center"><div class="eyebrow">TEST COMPLETE</div><h2 style="font-size:34px">انتهى الاختبار!</h2><div class="sf-achievement"><div style="font-size:32px">✦</div><div><b>نتيجتك: ${score} نقطة جديدة</b><div class="small muted">أكملت جولة تدريب على مهارات التحقيق وقراءة الأدلة.</div></div></div><p class="muted">الإجابات الصحيحة تُسجّل مرة واحدة فقط لمنع تكرار النقاط.</p><button class="btn primary" onclick="closeModal();showArchive()">العودة إلى الأرشيف</button> <button class="btn" onclick="closeModal()">إغلاق</button></section></div></div></div>`;};
window.home= function(){let h=oldHome?oldHome():'';return `<section class="sf-quiz-launch" style="margin:14px 0;padding:18px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div class="eyebrow">INTELLIGENCE LAB // 05 CHALLENGES</div><strong style="font-size:19px">اختبر ذكاءك — خمسة تدريبات على القضايا</strong><div class="small muted">قراءة الأدلة · اختبار الأعذار · التسلسل الزمني · الاستنتاج</div></div><button class="btn primary" onclick="window.openSFQuiz()">ابدأ الاختبار ↗</button></section>`+h};
window.openSFQuiz=openQuiz;
// Add a persistent quiz shortcut to the header without disturbing the existing layout.
const addShortcut=()=>{let a=document.querySelector('.top-actions');if(a&&!document.getElementById('sfQuizTop')){let b=document.createElement('button');b.id='sfQuizTop';b.className='btn sf-quiz-launch';b.textContent='✦ اختبار الذكاء';b.onclick=openQuiz;a.prepend(b)}};
const origRender=window.render;if(origRender)window.render=function(){origRender();addShortcut()};setTimeout(addShortcut,400);
// Lightweight neon particle field, capped for mobile performance.
const canvas=document.getElementById('sfParticleLayer');if(canvas&&canvas.getContext){const ctx=canvas.getContext('2d');let w=0,h=0,pts=[];const mobile=matchMedia('(max-width:700px)').matches;function resize(){w=canvas.width=innerWidth*devicePixelRatio;h=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';pts=Array.from({length:mobile?22:48},()=>({x:Math.random()*w,y:Math.random()*h,v:.15+Math.random()*.45,r:.6+Math.random()*1.5,a:.15+Math.random()*.45}))}function tick(){ctx.clearRect(0,0,w,h);for(const p of pts){p.y-=p.v*devicePixelRatio;if(p.y<0){p.y=h;p.x=Math.random()*w}ctx.beginPath();ctx.arc(p.x,p.y,p.r*devicePixelRatio,0,Math.PI*2);ctx.fillStyle=`rgba(135,220,255,${p.a})`;ctx.shadowBlur=12*devicePixelRatio;ctx.shadowColor='#a855f7';ctx.fill()}requestAnimationFrame(tick)}resize();addEventListener('resize',resize,{passive:true});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)tick();}
})();
</script>
